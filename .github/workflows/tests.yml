name: Tests

on:
  push:
  pull_request:

jobs:
  blender-tests:
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: "5.2.3"   # matches the version the add-on is tested with
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries Blender needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libxext6 libxfixes3 libgl1

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          MAJOR_MINOR="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${MAJOR_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Show Blender version
        run: ~/blender/blender --version

      - name: Run tests inside Blender
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tests/run_in_blender.py
